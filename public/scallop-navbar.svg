<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 26" width="52" height="26">
  <!-- Solid Olive bleed block from y=0 to y=6 that enters deep into navbar -->
  <rect x="0" y="0" width="52" height="7" fill="#91885D" />
  <!-- Large seamless olive semicircle extending downward -->
  <path d="M 0,5 L 52,5 C 52,17 40,25.5 26,25.5 C 12,25.5 0,17 0,5 Z" fill="#91885D" />
  <!-- Embossed artisanal inner contour -->
  <path d="M 2,5 C 2,15.5 13,23.5 26,23.5 C 39,23.5 50,15.5 50,5" fill="none" stroke="#A89E6E" stroke-width="1" opacity="0.45" />
  <!-- Darker olive bottom rim stroke only on the bottom arc, never on top -->
  <path d="M 0,5 C 0,17 12,25.5 26,25.5 C 40,25.5 52,17 52,5" fill="none" stroke="#78704A" stroke-width="1.5" />
</svg>
